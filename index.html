<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致 妈咪</title>
<style>
/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f9f7f4;
  --card: #ffffff;
  --ink: #2c2416;
  --ink-light: #8c8274;
  --ink-lighter: #bfb8ac;
  --accent: #b76e5c;
  --border: #e8e3db;
}

html, body { height: 100%; }

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Microsoft YaHei", serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  transition: background 0.8s ease;
}

/* ===== Fireworks Canvas ===== */
#fireworks {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#fireworks.on { opacity: 1; }

/* ===== Container ===== */
.main {
  width: 90vw;
  max-width: 420px;
  height: 78vh;
  max-height: 680px;
  min-height: 500px;
  position: relative;
  z-index: 1;
}

/* ===== Cards ===== */
.card-stack {
  position: relative;
  width: 100%;
  height: 100%;
}
.card {
  position: absolute;
  inset: 0;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0;
  transform: translateY(30px);
  pointer-events: none;
  transition: opacity 0.6s ease, transform 0.6s ease;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding: 48px 36px;
}
.card::-webkit-scrollbar { display: none; }
.card.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* ===== Card 1: Cover ===== */
.line-top { width: 24px; height: 1px; background: var(--ink); margin-bottom: 40px; }
.cover-to { font-size: 13px; letter-spacing: 6px; color: var(--ink-light); margin-bottom: 20px; }
.cover-name { font-size: 40px; font-weight: 400; letter-spacing: 12px; color: var(--ink); margin-bottom: 36px; }
.cover-line { width: 40px; height: 1px; background: var(--ink-lighter); margin-bottom: 36px; }
.cover-quote { font-size: 14px; color: var(--ink-light); line-height: 2; letter-spacing: 3px; }
.cover-hint { position: absolute; bottom: 40px; font-size: 11px; color: var(--ink-lighter); letter-spacing: 4px; }

/* ===== Card 2: First Meeting ===== */
.c2-label { font-size: 11px; letter-spacing: 5px; color: var(--ink-lighter); margin-bottom: 32px; }
.c2-photo {
  width: 150px; height: 150px; border-radius: 50%;
  background: #f2efe9; display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px; border: 1px solid var(--border);
}
.c2-photo-text { font-size: 11px; color: var(--ink-lighter); letter-spacing: 2px; }
.c2-photo-hint { font-size: 10px; color: var(--ink-lighter); margin-bottom: 28px; letter-spacing: 1px; }
.c2-date { font-size: 26px; font-weight: 400; letter-spacing: 6px; color: var(--ink); margin-bottom: 6px; }
.c2-place { font-size: 13px; color: var(--accent); letter-spacing: 4px; margin-bottom: 14px; }
.c2-text { font-size: 13px; color: var(--ink-light); line-height: 2; letter-spacing: 2px; }

/* ===== Card 3: Timeline ===== */
.c3-label { font-size: 11px; letter-spacing: 5px; color: var(--ink-lighter); margin-bottom: 36px; }
.timeline { width: 100%; max-width: 300px; }
.timeline-item { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 36px; text-align: left; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.timeline-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.timeline-line { width: 1px; flex: 1; min-height: 36px; background: var(--border); margin-top: 6px; }
.timeline-item:last-child .timeline-line { display: none; }
.timeline-content { padding-top: 1px; }
.timeline-date { font-size: 11px; color: var(--accent); letter-spacing: 3px; margin-bottom: 6px; }
.timeline-title { font-size: 16px; font-weight: 500; color: var(--ink); letter-spacing: 2px; margin-bottom: 5px; }
.timeline-desc { font-size: 12px; color: var(--ink-light); line-height: 1.7; letter-spacing: 1px; }

/* ===== Card 4: Love Letter ===== */
.c4-label { font-size: 11px; letter-spacing: 5px; color: var(--ink-lighter); margin-bottom: 32px; }
.love-letter {
  font-size: 15px;
  color: var(--ink);
  line-height: 2.2;
  letter-spacing: 2px;
  max-width: 300px;
  text-align: center;
}

/* ===== Card 5: Confession (starry night) ===== */
.card.end-card {
  background: transparent;
  border: none;
  z-index: 200;
  padding: 0;
}
.end-text-wrap {
  z-index: 300;
  text-align: center;
  position: relative;
}
.end-text-wrap .end-words {
  font-size: 32px;
  font-weight: 500;
  letter-spacing: 8px;
  color: #ffe9c8;
  text-shadow: 0 0 30px rgba(255,200,140,0.5), 0 0 60px rgba(255,180,120,0.25);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 2s ease, transform 2s ease;
}
.end-card.active .end-words {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 1.5s;
}

/* ===== Nav Dots ===== */
.nav {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 16px; z-index: 400;
}
.nav-dot {
  width: 5px; height: 5px; border-radius: 50%;
  cursor: pointer; transition: all 0.3s;
}
.nav-dot.light { background: rgba(255,255,255,0.45); }
.nav-dot.dark { background: var(--ink-lighter); }
.nav-dot.light.active { background: #fff; }
.nav-dot.dark.active { background: var(--ink); }

/* ===== Responsive ===== */
@media (max-width: 380px) {
  .card { padding: 36px 24px; }
  .cover-name { font-size: 32px; letter-spacing: 8px; }
  .end-words { font-size: 22px; }
}
</style>
</head>

<script>
(function() {
  const cards = document.querySelectorAll('.card');
  const dots = document.querySelectorAll('.nav-dot');
  const total = cards.length;
  let cur = 0, busy = false;

  function go(i) {
    if (busy || i === cur || i < 0 || i >= total) return;
    busy = true;
    cards[cur].classList.remove('active');
    dots[cur].classList.remove('active');
    cards[i].classList.add('active');
    dots[i].classList.add('active');
    cur = i;

    // Dynamic starry night on last card
    if (cur === total - 1) {
      startStarryNight();
      document.body.style.background = '#0b1622';
    } else {
      stopStarryNight();
      document.body.style.background = '';
    }

    setTimeout(() => { busy = false; }, 600);
  }

  document.getElementById('stack').addEventListener('click', () => {
    if (cur < total - 1) go(cur + 1);
  });

  document.getElementById('nav').addEventListener('click', e => {
    const d = e.target.closest('.nav-dot');
    if (d) go(parseInt(d.dataset.dot));
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
  });

  let sx = 0, sy = 0;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) go(dx < 0 ? cur + 1 : cur - 1);
  });

  /* ===== Dynamic Starry Night Engine ===== */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let W, H, running = false, animId;
  let stars = [], floatingLights = [], shootingStar = null;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    if (running) createStars();
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Twinkling Stars ---
  function createStars() {
    stars = [];
    const count = Math.floor((W * H) / 1400);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.3 + Math.random() * 2,
        baseAlpha: 0.25 + Math.random() * 0.75,
        phase: Math.random() * Math.PI * 2,
        speed: 0.008 + Math.random() * 0.04,
        hue: 30 + Math.random() * 50
      });
    }
  }

  function drawStars(time) {
    for (const s of stars) {
      const twinkle = s.baseAlpha + Math.sin(time * s.speed + s.phase) * 0.35;
      const alpha = Math.max(0.08, Math.min(1, twinkle));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsl(${s.hue}, 30%, 88%)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1.2 && alpha > 0.6) {
        ctx.globalAlpha = alpha * 0.22;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // --- Aurora / Nebula waves ---
  function drawAurora(time) {
    ctx.save();
    for (let wave = 0; wave < 3; wave++) {
      const baseY = H * 0.55 + wave * H * 0.12;
      const hue = 200 + wave * 30;
      ctx.globalAlpha = 0.03 + 0.01 * Math.sin(time * 0.0003 + wave);
      ctx.fillStyle = `hsl(${hue}, 60%, 55%)`;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += W / 40) {
        const y = baseY + Math.sin(x * 0.004 + time * 0.0008 + wave * 2) * 40
                  + Math.sin(x * 0.01 + time * 0.0015) * 25;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // --- Shooting Star ---
  function spawnShootingStar() {
    if (shootingStar || Math.random() > 0.008) return;
    const fromLeft = Math.random() < 0.5;
    shootingStar = {
      x: fromLeft ? Math.random() * W * 0.25 : W * 0.75 + Math.random() * W * 0.25,
      y: Math.random() * H * 0.35,
      vx: (fromLeft ? 1 : -1) * (3.5 + Math.random() * 5),
      vy: 1.5 + Math.random() * 3.5,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      length: 70 + Math.random() * 110
    };
  }

  function drawShootingStar() {
    if (!shootingStar) return;
    const s = shootingStar;
    const angle = Math.atan2(s.vy, s.vx);
    const tx = s.x - Math.cos(angle) * s.length * s.life;
    const ty = s.y - Math.sin(angle) * s.length * s.life;
    const grad = ctx.createLinearGradient(s.x, s.y, tx, ty);
    grad.addColorStop(0, `rgba(255,255,245,${s.life})`);
    grad.addColorStop(0.3, `rgba(255,240,210,${s.life * 0.65})`);
    grad.addColorStop(1, 'rgba(255,210,160,0)');
    ctx.save();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.restore();
    // Head
    ctx.save();
    ctx.globalAlpha = s.life * 0.85;
    ctx.fillStyle = '#fffef5';
    ctx.shadowColor = '#fffef5';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0 || s.x < -150 || s.x > W + 150 || s.y > H + 150) shootingStar = null;
  }

  // --- Floating Light Particles (fireflies) ---
  function addFloatingLight() {
    if (!running || floatingLights.length > 18) return;
    floatingLights.push({
      x: Math.random() * W,
      y: H + 30,
      r: 1 + Math.random() * 2,
      glow: 10 + Math.random() * 20,
      alpha: 0.35 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      flicker: 0.015 + Math.random() * 0.04,
      driftAmp: 20 + Math.random() * 50,
      driftFreq: 0.002 + Math.random() * 0.006,
      vy: -0.2 - Math.random() * 0.5,
      hue: 35 + Math.random() * 35
    });
  }

  function drawFloatingLights(time) {
    floatingLights = floatingLights.filter(f => {
      f.y += f.vy;
      f.x += Math.sin(time * f.driftFreq + f.phase) * f.driftAmp * 0.025;
      const flicker = 0.5 + 0.5 * Math.sin(time * f.flicker + f.phase);
      const alpha = f.alpha * flicker;
      ctx.save();
      ctx.globalAlpha = alpha * 0.2;
      const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.glow);
      glow.addColorStop(0, `hsla(${f.hue}, 75%, 72%, 1)`);
      glow.addColorStop(0.5, `hsla(${f.hue}, 55%, 55%, 0.25)`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.glow, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsl(${f.hue}, 25%, 88%)`;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return f.y > -50;
    });
  }

  // --- Main Loop ---
  function draw(time) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    drawAurora(time);
    drawStars(time);
    spawnShootingStar();
    drawShootingStar();
    drawFloatingLights(time);
    if (running) animId = requestAnimationFrame(draw);
  }

  function startStarryNight() {
    if (running) return;
    running = true;
    canvas.classList.add('on');
    floatingLights = [];
    shootingStar = null;
    createStars();
    ctx.clearRect(0, 0, W, H);
    animId = requestAnimationFrame(draw);
    // Add floating lights periodically
    function scheduleLight() {
      if (!running) return;
      addFloatingLight();
      setTimeout(scheduleLight, 800 + Math.random() * 2000);
    }
    setTimeout(scheduleLight, 600);
  }

  function stopStarryNight() {
    running = false;
    canvas.classList.remove('on');
    if (animId) cancelAnimationFrame(animId);
    stars = [];
    floatingLights = [];
    shootingStar = null;
    ctx.clearRect(0, 0, W, H);
  }
})();
</script>

</body>
